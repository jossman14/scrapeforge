[alembic]
# Path to the migration scripts directory (relative to this file's location)
script_location = db/migrations

# Database URL — overridden at runtime by the DATABASE_URL environment variable
# (see env.py). This value is used only for `alembic offline` SQL generation.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/scrapeforge

# Template used when generating new revision files
file_template = %%(rev)s_%%(slug)s

# Timezone for "Create Date" stamps in revision files
timezone = UTC

[post_write_hooks]
# Optionally run ruff/black on freshly generated migration files:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
